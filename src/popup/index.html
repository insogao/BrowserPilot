<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrowserPilot</title>
    <style>
      :root {
        --blue: #3b82f6;
        --blue-hover: #2563eb;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --ok: #16a34a;
        --warn: #d97706;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px;
        width: 292px;
        font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
        font-size: 13px;
        color: var(--fg);
        background: var(--bg);
      }
      h1 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
      .dot.on { background: var(--ok); }
      .dot.paused { background: var(--warn); }
      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 10px;
        background: #f9fafb;
      }
      .row { display: flex; justify-content: space-between; padding: 2px 0; }
      .row .k { color: var(--muted); }
      .row .v { font-weight: 500; word-break: break-all; text-align: right; }
      .main-action { margin-bottom: 9px; }
      .main-action button { width: 100%; }
      .utilities { display: flex; gap: 8px; }
      .utilities .copy { flex: 1; }
      .utilities .icon { width: 40px; padding-left: 0; padding-right: 0; font-size: 17px; }
      button {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--fg);
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
      }
      button:hover { background: #f3f4f6; }
      button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
      button.primary:hover { background: var(--blue-hover); }
      button.resume { color: #92400e; background: #fffbeb; border-color: #fcd34d; }
      button[hidden] { display: none; }
      .toast { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; }
    </style>
  </head>
  <body>
    <h1><span class="dot" id="dot"></span> BrowserPilot</h1>

    <div class="card">
      <div class="row"><span class="k">Host 状态</span><span class="v" id="host">未就绪</span></div>
      <div class="row"><span class="k">Agent 状态</span><span class="v" id="connection">未连接</span></div>
      <div class="row"><span class="k">Profile</span><span class="v" id="profile">-</span></div>
      <div class="row"><span class="k">Host 端口</span><span class="v" id="hostPort">-</span></div>
    </div>

    <div class="main-action">
      <button class="primary" id="takeover" hidden>人工接管</button>
    </div>
    <div class="utilities">
      <button class="copy" id="guide" title="复制技能安装引导（GitHub SKILL.md + 本机连接信息）">⧉&nbsp; Copy Skill</button>
      <button class="icon" id="manage" title="管理操作模板" aria-label="管理操作模板">⚙</button>
    </div>

    <div class="card" id="groq-card">
      <div class="row"><span class="k">Groq API Key（语音转文本）</span></div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <input id="groq-key" type="password" placeholder="gsk_..." style="flex:1;min-width:0;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;" />
        <button id="save-groq-key" style="padding:6px 10px;">保存</button>
      </div>
      <div class="row" style="margin-top:4px;"><span class="k" id="groq-key-state">未配置</span></div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="index.js"></script>
  </body>
</html>
