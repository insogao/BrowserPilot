<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ego-lite Browser Agent</title>
    <style>
      :root {
        --blue: #3b82f6;
        --blue-hover: #2563eb;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --danger: #dc2626;
        --ok: #16a34a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px;
        width: 320px;
        font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
        font-size: 13px;
        color: var(--fg);
        background: var(--bg);
      }
      h1 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
      .dot.on { background: var(--ok); }
      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 10px;
        background: #f9fafb;
      }
      .row { display: flex; justify-content: space-between; padding: 2px 0; }
      .row .k { color: var(--muted); }
      .row .v { font-weight: 500; word-break: break-all; text-align: right; }
      .buttons { display: flex; flex-direction: column; gap: 8px; }
      button {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--fg);
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
      }
      button:hover { background: #f3f4f6; }
      button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
      button.primary:hover { background: var(--blue-hover); }
      button.danger { color: var(--danger); }
      .toast { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; }
    </style>
  </head>
  <body>
    <h1><span class="dot" id="dot"></span> ego-lite Browser Agent</h1>

    <div class="card">
      <div class="row"><span class="k">接管状态</span><span class="v" id="attached">未接管</span></div>
      <div class="row"><span class="k">层级</span><span class="v" id="layer">-</span></div>
      <div class="row"><span class="k">Profile</span><span class="v" id="profile">-</span></div>
      <div class="row"><span class="k">Host 端口</span><span class="v" id="port">-</span></div>
    </div>

    <div class="buttons">
      <button class="primary" id="takeover">接管当前标签页</button>
      <button id="guide">复制使用文档</button>
      <button class="danger" id="stop">Stop</button>
    </div>

    <div class="toast" id="toast"></div>
    <script src="index.js"></script>
  </body>
</html>
