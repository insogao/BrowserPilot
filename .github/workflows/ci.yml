name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run registry:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:core
      - run: npm run test:profile
      - run: npm run test:host
