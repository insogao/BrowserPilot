<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>IME inputs</title>
<style>
  html, body { margin: 0; padding: 0; background: #f4f6f8; color: #111;
    font: 14px system-ui, "Segoe UI", sans-serif; }
  .row { margin: 18px 24px; }
  input, textarea, [contenteditable] { font: 16px monospace; padding: 6px;
    box-sizing: border-box; border: 1px solid #888; background: #fff; }
  #in { width: 420px; height: 38px; }
  #ta { width: 520px; height: 100px; }
  #ce { width: 520px; min-height: 80px; border: 1px solid #888; }
  #hud { margin: 12px 24px; font: 12px monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="row"><label>input: <input id="in" type="text" autocomplete="off" spellcheck="false"></label></div>
<div class="row"><label>textarea:<br><textarea id="ta" autocomplete="off" spellcheck="false"></textarea></label></div>
<div class="row"><label>contenteditable:<br><div id="ce" contenteditable="true" spellcheck="false"></div></label></div>
<div id="hud">ready</div>
<script>
(() => {
  const state = { composition: 0, input: 0, keydown: 0, keys: [] };
  const ids = ["in", "ta", "ce"];
  for (const id of ids) {
    const el = document.getElementById(id);
    el.addEventListener("compositionstart", () => { state.composition += 1; });
    el.addEventListener("input", () => { state.input += 1; });
    el.addEventListener("keydown", (e) => {
      state.keydown += 1;
      if (state.keys.length < 100) state.keys.push({ key: e.key, code: e.code, target: id, trusted: e.isTrusted });
    });
  }
  window.__ime = () => {
    const values = {};
    for (const id of ids) {
      const el = document.getElementById(id);
      values[id] = el.isContentEditable ? el.textContent : el.value;
    }
    return {
      values,
      active: document.activeElement ? (document.activeElement.id || document.activeElement.tagName) : null,
      composition: state.composition,
      input: state.input,
      keydown: state.keydown,
      keys: state.keys.slice(-20),
      visibility: document.visibilityState,
      focus: document.hasFocus(),
    };
  };
  window.__reset = () => {
    for (const id of ids) {
      const el = document.getElementById(id);
      if (el.isContentEditable) el.textContent = ""; else el.value = "";
    }
    state.composition = 0; state.input = 0; state.keydown = 0; state.keys = [];
    document.getElementById("hud").textContent = "reset";
    return true;
  };
})();
</script>
</body>
</html>
